name: Build and test

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  schedule:
    - cron: '45 9 * * 6'

jobs:
  build-test-short:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [ '~1.25.0', '~1.26.0' ]
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./... -test.short
  analyze:
    needs: build-test-short
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '~1.26.0'
      - name: Coverage
        run: go test -v -coverprofile='coverage.out' -coverpkg=./... -json ./... > report.json
      - name: Upload log files on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: analyzeRunOutput
          path: |
            ${{ github.workspace }}/**/*.log
            ${{ github.workspace }}/**/report.json
          retention-days: 1
      - name: SonarQube Scan
        # the sha references v8.2.1
        uses: sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}      